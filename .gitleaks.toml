# Gitleaks' default rules, plus one allowlist: the Access AUD tags of infra/targets.json are public
# 64-hex identifiers (they sit in every Access JWT's aud claim), which generic-api-key mistakes for keys.
[extend]
useDefault = true

[[allowlists]]
description = "Cloudflare Access AUD tags in the registry"
condition = "AND"
paths = ['''^infra/targets\.json$''']
regexTarget = "line"
regexes = ['''^\s*"accessAud": "[0-9a-f]{64}",?$''']

[[allowlists]]
# Generated by build.mjs: only module imports of site/ files, whose content-hash names (one holds
# "key") trip generic-api-key. No value of any kind is written there.
description = "Holding page manifest (file names only)"
paths = ['''^workers/holding-page/manifest\.js$''']
